set -g mouse on
set -g default-terminal "screen-256color"
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 50000
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g base-index 1
set -g pane-base-index 1
set -gq allow-passthrough on
set -g visual-activity off

#Remove *all* keybindings
unbind-key -a
set -g status-keys vi
set -g mode-keys vi

set -g prefix C-a

#General
bind ^D detach
bind r command-prompt "rename-session '%%'"
bind R source-file ~/.config/tmux/tmux.conf
bind : command-prompt

#Windows

bind c new-window
bind w choose-window
bind C kill-window
bind p previous-window

bind-key -n M-0 selectw -t 0
bind-key -n M-1 selectw -t 1
bind-key -n M-2 selectw -t 2
bind-key -n M-3 selectw -t 3
bind-key -n M-4 selectw -t 4
bind-key -n M-5 selectw -t 5
bind-key -n M-6 selectw -t 6
bind-key -n M-7 selectw -t 7
bind-key -n M-8 selectw -t 8
bind-key -n M-9 selectw -t 9

#Panes
#Horizontal
bind e split-window -v -c "#{pane_current_path}" 

#Vertical
bind n split-window -h -c "#{pane_current_path}" 

bind X kill-pane
bind m resize-pane -Z
bind -r -T prefix h resize-pane -L 1
bind -r -T prefix j resize-pane -D 1
bind -r -T prefix k resize-pane -U 1
bind -r -T prefix l resize-pane -R 1

#Copy mode
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

#Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'Chaitanyabsprip/tmux-harpoon'
# set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'catppuccin/tmux#v2.1.2'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-resurrect'

#Configure plugins
set -g @resurrect-strategy-nvim 'session'
set -g @ressurect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restored 'on'

# source the plugin here
run '~/.tmux/plugins/tpm/tpm'

# Reset to tmux's default formats first, so re-sourcing this file (prefix+r,
# theme switches) copies the real default line instead of the blanked one.
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''
set -g status 2


# Theme. Generated by acheron-theme-tmux from the active theme's colors.toml;
# switch themes with `acheron-theme-set <name>`.
source-file ~/.config/acheron/theme/current/tmux.conf

# binds
# Custom Scripts for workflow
bind-key -r i run-shell "tmux neww ~/work/main/dotsh/fzf/ch"
bind-key -r t run-shell "tmux neww ~/work/main/dotsh/fzf/tmux-session"
bind-key -r d run-shell "tmux neww ~/work/main/dotsh/fzf/edit-dotfiles"
bind-key -r m run-shell "tmux neww mpterm"
